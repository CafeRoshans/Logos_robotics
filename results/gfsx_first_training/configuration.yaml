default_settings: null
behaviors:
  GFSX_Brain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.00025
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 10
    even_checkpoints: false
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 20000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: Build/GFSX_Simulator.exe
  env_args: null
  base_port: 5005
  num_envs: 4
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
  no_graphics_monitor: false
environment_parameters:
  ball_max_distance:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 7731
          min_value: 0.5
          max_value: 3.0
      name: ball_max_distance
      completion_criteria: null
  episode_length:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 7732
          min_value: 1500.0
          max_value: 1500.0
      name: episode_length
      completion_criteria: null
  ball_scale:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 7733
          min_value: 0.04
          max_value: 0.07
      name: ball_scale
      completion_criteria: null
  ball_mass:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 7734
          min_value: 0.05
          max_value: 0.2
      name: ball_mass
      completion_criteria: null
  vision_noise:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 7735
          min_value: 0.02
          max_value: 0.06
      name: vision_noise
      completion_criteria: null
  vision_dropout:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 7736
          min_value: 0.05
          max_value: 0.15
      name: vision_dropout
      completion_criteria: null
checkpoint_settings:
  run_id: gfsx_first_training
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
