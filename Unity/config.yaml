behaviors:
  GFSX_Brain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 2.5e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 320
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 20000
    checkpoint_interval: 100000
    keep_checkpoints: 10


environment_parameters:

  # ============================================================
  # CURRICULUM: параметры с пошаговым усложнением
  # Этап 1 (easy):    мяч рядом, нет препятствий, нет шума
  # Этап 2 (medium):  3 точки мяча, 1 препятствие, лёгкий шум
  # Этап 3 (full):    все точки, 2 препятствия, полный шум
  # ============================================================

  ball_spawn_count:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 1
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 3
      - name: full
        value: -1

  obstacle_count:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 1
      - name: full
        value: 2

  vision_noise:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0.0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 0.02
      - name: full
        value: 0.04

  ultrasonic_noise:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0.0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 0.03
      - name: full
        value: 0.06

  sensor_latency:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 2
      - name: full
        value: 3

  action_latency:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 2
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 4
      - name: full
        value: 5

  # ============================================================
  # РАНДОМИЗАЦИЯ: sampler-параметры (с первого шага)
  # ============================================================

  ball_scale:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.04
      max_value: 0.07

  ball_mass:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.05
      max_value: 0.2

  # ============================================================
  # ОБСТАНОВКА: не награда, но и не curriculum-этап — respawn препятствий
  # ============================================================

  obstacle_respawn_every: 1

  # ============================================================
  # НАГРАДЫ И ШТРАФЫ ЗДЕСЬ БЫЛИ И БОЛЬШЕ НЕ ЧИТАЮТСЯ — по прямому запросу (2026-07-22):
  # куррикулум должен усложнять ОБСТАНОВКУ (см. блоки выше и sampler'ы мяча), но не должен
  # иметь возможность незаметно перезаписать тюнинг наград при запуске через mlagents-learn.
  # RobotBrain.ReadYamlEnvParams() больше не содержит блок чтения distance_reward_*,
  # *_penalty, *_bonus и т.д. — единственный источник истины для наград теперь ТОЛЬКО
  # инспектор / ArenaPoint.prefab. Если захочешь вернуть управление наградами из yaml —
  # смотри git history этого файла и RobotBrain.cs на коммит до 2026-07-22.
  # ============================================================
