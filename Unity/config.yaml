behaviors:
  GFSX_Brain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 2.5e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 320
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 20000
    checkpoint_interval: 100000
    keep_checkpoints: 10


environment_parameters:

  # ============================================================
  # CURRICULUM: параметры с пошаговым усложнением
  # Этап 1 (easy):    мяч рядом, нет препятствий, нет шума
  # Этап 2 (medium):  3 точки мяча, 1 препятствие, лёгкий шум
  # Этап 3 (full):    все точки, 2 препятствия, полный шум
  # ============================================================

  ball_spawn_count:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 1
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 3
      - name: full
        value: -1

  obstacle_count:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 1
      - name: full
        value: 2

  vision_noise:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0.0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 0.02
      - name: full
        value: 0.04

  ultrasonic_noise:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0.0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 0.03
      - name: full
        value: 0.06

  sensor_latency:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 2
      - name: full
        value: 3

  action_latency:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 2
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 4
      - name: full
        value: 5

  # ============================================================
  # РАНДОМИЗАЦИЯ: sampler-параметры (с первого шага)
  # ============================================================

  ball_scale:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.04
      max_value: 0.07

  ball_mass:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.05
      max_value: 0.2

  # ============================================================
  # КОНСТАНТЫ: награды и штрафы (не меняются по curriculum)
  # БЫЛО багом: sampler_type: constant — невалидный тип в ML-Agents (валидны только
  # uniform/gaussian/multirangeuniform). Для константы просто пишется голое значение
  # без sampler_type/sampler_parameters вообще — так и сделано ниже.
  # ============================================================

  obstacle_respawn_every: 1

  distance_reward_scale: 1.0

  distance_reward_alpha: 2.0

  close_radius: 0.35

  drive_rate_penalty: 0.001

  wall_proximity_penalty: 0.01

  obstacle_collision_penalty: 4.0

  end_episode_on_obstacle_hit: 0

  grab_success_reward: 8.0

  timeout_penalty: 1.0

  out_of_arena_penalty: 3.5

  per_step_penalty: 0.0005

  gentle_linear_speed_thresh: 0.08

  gentle_angular_speed_thresh: 0.15

  gentle_placement_bonus: 0.008

  gentle_overspeed_penalty: 0.015

  centering_bonus_max: 0.012

  centering_streak_cap: 30

  centering_angle_threshold: 0.25

  centering_min_movement: 0.03

  body_camera_alignment_bonus: 0.007

  body_camera_alignment_tolerance_deg: 3.0

  blind_approach_bonus: 0.003

  blind_approach_min_forward_speed: 0.05

  backward_movement_penalty: 0.01

  backward_movement_deadzone: 0.01
