behaviors:
  GFSX_Brain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 2.5e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 40000000
    time_horizon: 512
    summary_freq: 20000
    checkpoint_interval: 100000
    keep_checkpoints: 20


environment_parameters:

  # ============================================================
  # CURRICULUM: parameters with staged difficulty progression
  # Stage 1 (easy):    no obstacles, no noise
  # Stage 2 (medium):  1 obstacle, light noise
  # Stage 3 (full):    2 obstacles, full noise
  # Ball spawn is no longer a curriculum stage - it's sampled continuously inside
  # a hand-placed safe zone (RobotBrain.ballSpawnZoneCenter/ballSpawnZoneHalfExtents),
  # ported from feat/making-rl-work, replacing the old 9 fixed ballSpawnPoints +
  # ball_spawn_count staging (a narrow, easily-overfit distribution).
  # ============================================================

  obstacle_count:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 1
      - name: full
        value: 2

  vision_noise:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0.0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 0.02
      - name: full
        value: 0.04

  ultrasonic_noise:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0.0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 0.03
      - name: full
        value: 0.06

  sensor_latency:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 2
      - name: full
        value: 3

  action_latency:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 6.0
        value: 2
      - name: medium
        completion_criteria:
          measure: reward
          behavior: GFSX_Brain
          min_lesson_length: 100
          threshold: 5.0
        value: 4
      - name: full
        value: 5

  # ============================================================
  # RANDOMIZATION: sampler parameters (active from step 1)
  # ============================================================

  ball_scale:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.04
      max_value: 0.07

  ball_mass:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.05
      max_value: 0.2

  # ============================================================
  # ENVIRONMENT: not a reward, not a curriculum stage either - obstacle respawn
  # ============================================================

  obstacle_respawn_every: 1

  # ============================================================
  # REWARDS AND PENALTIES USED TO BE HERE AND ARE NO LONGER READ - by explicit
  # request (2026-07-22): curriculum should scale up the ENVIRONMENT (see blocks
  # above and the ball samplers), but must not be able to silently overwrite
  # reward tuning when running via mlagents-learn. RobotBrain.ReadYamlEnvParams()
  # no longer contains the block that read distance_reward_*, *_penalty, *_bonus,
  # etc. - the single source of truth for rewards now is ONLY the Inspector /
  # ArenaPoint.prefab. If you ever want reward control back from yaml, check the
  # git history of this file and RobotBrain.cs at the commit before 2026-07-22.
  # ============================================================
